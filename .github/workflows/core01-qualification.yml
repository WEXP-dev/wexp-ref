name: Core-01 qualification

# Runs both independent engines and the comparator over both public Core-01
# vector sets. The corpus is fetched from the exact wexp-vectors commit pinned
# in config/wexp-vectors-core01.lock.json; every set manifest must match that
# lock before any engine executes.
#
# A portable-only push result is developer feedback, not qualification
# readiness. Pull requests and manual runs require Linux amd64, macOS arm64,
# and real Windows x64 observations plus the cross-environment comparison.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/wexp_ref/core01/**'
      - 'config/wexp-vectors-core01.lock.json'
      - 'scripts/verify_core01_corpus.py'
      - 'scripts/windows_tamper_demo.ps1'
      - 'tests/test_core01_*.py'
      - '.gitattributes'
      - 'README.md'
      - 'docs/persona-b-windows-retest.md'
      - '.github/workflows/core01-qualification.yml'
  push:
    branches:
      - main
    paths:
      - 'src/wexp_ref/core01/**'
      - 'config/wexp-vectors-core01.lock.json'
      - 'scripts/verify_core01_corpus.py'
      - 'scripts/windows_tamper_demo.ps1'
      - 'tests/test_core01_*.py'
      - '.gitattributes'
      - '.github/workflows/core01-qualification.yml'

permissions:
  contents: read

env:
  CORE01_SETS: WEXP-CORE-01-VECTORS-001 WEXP-CORE-01-VECTORS-002

jobs:
  plan:
    name: schedule
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.policy.outputs.include }}
      full_matrix: ${{ steps.policy.outputs.full_matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve the scheduling policy
        id: policy
        run: |
          set -euo pipefail
          python3 src/wexp_ref/core01/tools/matrix_policy.py --event "${{ github.event_name }}"
          {
            printf 'include=%s\n' "$(python3 src/wexp_ref/core01/tools/matrix_policy.py \
              --event "${{ github.event_name }}" --field include)"
            printf 'full_matrix=%s\n' "$(python3 src/wexp_ref/core01/tools/matrix_policy.py \
              --event "${{ github.event_name }}" --field full_matrix)"
          } >>"$GITHUB_OUTPUT"

  qualify:
    name: qualify both sets (${{ matrix.environment }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Fetch the pinned vector corpus
        if: matrix.environment != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 -c 'import json;print(json.load(open("config/wexp-vectors-core01.lock.json"))["commit"])')"
          git clone --quiet https://github.com/WEXP-dev/wexp-vectors.git build/wexp-vectors
          git -C build/wexp-vectors checkout --quiet --detach "$commit"
          observed="$(git -C build/wexp-vectors rev-parse HEAD)"
          [ "$observed" = "$commit" ] || { echo "corpus commit mismatch: $observed"; exit 1; }

      - name: Fetch the pinned vector corpus on Windows with core.autocrlf=true
        if: matrix.environment == 'windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "Windows PowerShell 5.1 is required; observed $($PSVersionTable.PSVersion)"
          }
          Write-Output "Windows PowerShell $($PSVersionTable.PSVersion)"
          git config --global core.autocrlf true
          if ($LASTEXITCODE -ne 0) { throw "could not set core.autocrlf=true" }
          $Lock = Get-Content -LiteralPath "config\wexp-vectors-core01.lock.json" -Raw |
              ConvertFrom-Json
          git clone https://github.com/WEXP-dev/wexp-vectors.git build\wexp-vectors
          if ($LASTEXITCODE -ne 0) { throw "wexp-vectors clone failed" }
          git -C build\wexp-vectors checkout --quiet --detach $Lock.commit
          if ($LASTEXITCODE -ne 0) { throw "locked wexp-vectors checkout failed" }
          $Observed = git -C build\wexp-vectors rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $Observed -ne $Lock.commit) {
              throw "corpus commit mismatch: $Observed"
          }
          $AutoCrlf = git -C build\wexp-vectors config --get core.autocrlf
          if ($LASTEXITCODE -ne 0 -or $AutoCrlf -ne "true") {
              throw "Windows checkout did not use core.autocrlf=true"
          }

      - name: Verify exact checkout and both manifest identities
        run: >-
          python scripts/verify_core01_corpus.py
          --lock config/wexp-vectors-core01.lock.json
          --repository build/wexp-vectors

      - name: Unit tests and independence firewall
        if: matrix.environment != 'docker'
        env:
          WEXP_CORE01_CORPUS: build/wexp-vectors/vectors/WEXP-CORE-01-VECTORS-001
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -p 'test_core01_*.py' -v

      - name: Qualify both sets (Linux or macOS host)
        if: matrix.environment != 'docker' && matrix.environment != 'windows'
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          for candidate_id in $CORE01_SETS; do
            python3 -m wexp_ref.core01.harness.orchestrate \
              --candidate "build/wexp-vectors/vectors/${candidate_id}" \
              --output "build/qualification/${{ matrix.environment }}" \
              --environment "${{ matrix.environment }}"
          done

      - name: Qualify both sets (Windows PowerShell 5.1)
        if: matrix.environment == 'windows'
        shell: powershell
        env:
          PYTHONPATH: src
        run: |
          $ErrorActionPreference = "Stop"
          $Sets = $env:CORE01_SETS -split '\s+'
          foreach ($Set in $Sets) {
              $Candidate = Join-Path -Path (Get-Location).Path -ChildPath (
                  "build\wexp-vectors\vectors\" + $Set
              )
              python -m wexp_ref.core01.harness.orchestrate `
                  --candidate $Candidate `
                  --output build\qualification\windows `
                  --environment windows
              if ($LASTEXITCODE -ne 0) { throw "qualification failed for $Set" }
          }

      - name: Exercise PowerShell tamper recipe and fail-closed result
        if: matrix.environment == 'windows'
        shell: powershell
        env:
          PYTHONPATH: src
        run: |
          $ErrorActionPreference = "Stop"
          $Root = (Get-Location).Path
          $Source = Join-Path -Path $Root -ChildPath (
              "build\wexp-vectors\vectors\WEXP-CORE-01-VECTORS-001"
          )
          $TamperRoot = Join-Path -Path $Root -ChildPath "build\windows-tamper"
          New-Item -ItemType Directory -Path $TamperRoot | Out-Null
          $Candidate = Join-Path -Path $TamperRoot -ChildPath (
              "WEXP-CORE-01-VECTORS-001"
          )
          Copy-Item -LiteralPath $Source -Destination $Candidate -Recurse
          $Relative = "vectors\WEXP-CORE-01-Q001-TV-0001.json"
          $Target = Join-Path -Path $Candidate -ChildPath $Relative
          $Before = [System.IO.File]::ReadAllBytes($Target)

          powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File scripts\windows_tamper_demo.ps1 `
              -Candidate $Candidate -RelativeFile $Relative -Index 0
          if ($LASTEXITCODE -ne 0) { throw "valid tamper recipe failed" }
          $After = [System.IO.File]::ReadAllBytes($Target)
          if ($Before.Length -ne $After.Length) { throw "tamper changed file length" }
          $Changed = 0
          for ($Index = 0; $Index -lt $Before.Length; $Index++) {
              if ($Before[$Index] -ne $After[$Index]) { $Changed++ }
          }
          if ($Changed -ne 1) { throw "tamper changed $Changed bytes instead of one" }

          $BeforeInvalidRequest = (Get-FileHash -LiteralPath $Target -Algorithm SHA256).Hash
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File scripts\windows_tamper_demo.ps1 `
              -Candidate $Candidate -RelativeFile $Relative -Index $After.Length
          $InvalidExit = $LASTEXITCODE
          $AfterInvalidRequest = (Get-FileHash -LiteralPath $Target -Algorithm SHA256).Hash
          if ($InvalidExit -eq 0) { throw "invalid tamper request unexpectedly succeeded" }
          if ($BeforeInvalidRequest -ne $AfterInvalidRequest) {
              throw "invalid tamper request changed the target"
          }

          python -m wexp_ref.core01.harness.orchestrate `
              --candidate $Candidate `
              --output build\windows-tamper-result `
              --environment windows
          $QualificationExit = $LASTEXITCODE
          if ($QualificationExit -eq 0) {
              throw "one-byte-mutated candidate unexpectedly passed"
          }
          Write-Output "PASS: one-byte mutation failed closed"
          exit 0

      - name: Qualify both sets (container)
        if: matrix.environment == 'docker'
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f docker/Dockerfile -t wexp-core01:ci .
          for candidate_id in $CORE01_SETS; do
            docker run --rm --platform linux/amd64 \
              -v "${PWD}/build:/work/build" wexp-core01:ci \
              --candidate "/work/build/wexp-vectors/vectors/${candidate_id}" \
              --output "/work/build/qualification/docker" \
              --environment docker
          done

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core01-qualification-${{ matrix.environment }}
          path: build/qualification/${{ matrix.environment }}/
          if-no-files-found: error
          retention-days: 30

  portability:
    name: cross-environment portability for both sets
    needs: [plan, qualify]
    if: needs.plan.outputs.full_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Download evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: evidence

      - name: Compare all four environments for both sets
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          mkdir -p build/portability
          for candidate_id in $CORE01_SETS; do
            python3 src/wexp_ref/core01/tools/compare_environments.py \
              --bundle "portable=evidence/core01-qualification-portable/${candidate_id}/QUALIFICATION.json" \
              --bundle "docker=evidence/core01-qualification-docker/${candidate_id}/QUALIFICATION.json" \
              --bundle "darwin=evidence/core01-qualification-darwin/${candidate_id}/QUALIFICATION.json" \
              --bundle "windows=evidence/core01-qualification-windows/${candidate_id}/QUALIFICATION.json" \
              --require-full-matrix \
              --json "build/portability/${candidate_id}.json"
          done

      - name: Upload portability reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core01-portability-reports
          path: build/portability/
          if-no-files-found: error
          retention-days: 30
