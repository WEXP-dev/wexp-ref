name: Reference tooling validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate vector dependency lock
        run: >-
          wexp-ref validate-lock
          --output build/vector-lock-validation.json

      - name: Check out exact vector candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: WEXP-dev/wexp-vectors
          ref: 2da7309d75762e4cf1e83b86bd606f4d473b1638
          path: build/wexp-vectors
          persist-credentials: false

      - name: Verify exact vector checkout and manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          lock = json.loads(Path("config/wexp-vectors.lock.json").read_text())
          access = json.loads(
              Path("config/wexp-vectors-execution-access.json").read_text()
          )
          observed = subprocess.run(
              ["git", "-C", "build/wexp-vectors", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          assert observed == lock["commit"] == access["commit"]
          manifest = Path("build/wexp-vectors") / lock["manifest_path"]
          digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert digest == lock["manifest_sha256"] == access["manifest_sha256"]
          assert lock["package_status"] == "candidate"
          assert access["status"] == "CANDIDATE_PINNED"
          print(f"exact candidate identity verified: {observed} {digest}")
          PY

      - name: Execute Core -00 candidate vectors
        run: >-
          wexp-ref core00-run-vectors build/wexp-vectors
          --output build/core00-results.json

      - name: Confirm deterministic vector results
        run: |
          wexp-ref core00-run-vectors build/wexp-vectors \
            --output build/core00-results-second.json
          cmp build/core00-results.json build/core00-results-second.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("build/core00-results.json").read_text())
          assert result["summary"] == {
              "agree": 7,
              "disagree": 0,
              "status": "PASS",
              "total": 7,
          }
          assert result["vector_package"]["package_status"] == "candidate"
          print("PASS: seven candidate vectors agree with frozen expectations")
          PY

      - name: Validate exact Action pins
        run: python scripts/check_action_pins.py

      - name: CLI smoke test
        run: wexp-ref --version

      - name: Generic runner smoke test
        run: >-
          wexp-ref run examples/runner-smoke-plan.json
          --workspace .
          --record WEXP-REF-RUNNER-OBSERVATION.json

      - name: Assert experimental record marker and non-claims
        run: >-
          python -c "import json; r=json.load(open('WEXP-REF-RUNNER-OBSERVATION.json'));
          assert r['record_kind']=='wexp-ref-runner-observation';
          assert r['overall_exit_status']==0;
          assert len(r['non_claims']) >= 4"

      - name: Retain runner observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wexp-ref-runner-observations
          path: |
            WEXP-REF-RUNNER-OBSERVATION.json
            build/core00-results.json
            build/vector-lock-validation.json
          if-no-files-found: warn
          retention-days: 7
