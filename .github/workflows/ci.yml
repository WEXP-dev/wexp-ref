name: Reference tooling validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate public vector dependency state
        run: wexp-ref validate-lock

      - name: Confirm cross-repository execution is explicitly blocked
        run: >-
          python -c "import json;
          s=json.load(open('config/wexp-vectors-execution-access.json'));
          assert s['status']=='BLOCKED';
          print('BLOCKED: cross-repository vectors were not executed')"

      - name: Validate exact Action pins
        run: python scripts/check_action_pins.py

      - name: CLI smoke test
        run: wexp-ref --version

      - name: Generic runner smoke test
        run: >-
          wexp-ref run examples/runner-smoke-plan.json
          --workspace .
          --record WEXP-REF-RUNNER-OBSERVATION.json

      - name: Assert experimental record marker and non-claims
        run: >-
          python -c "import json; r=json.load(open('WEXP-REF-RUNNER-OBSERVATION.json'));
          assert r['record_kind']=='wexp-ref-runner-observation';
          assert r['overall_exit_status']==0;
          assert len(r['non_claims']) >= 4"

      - name: Retain runner observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wexp-ref-runner-observations
          path: |
            WEXP-REF-RUNNER-OBSERVATION.json
            build/vector-lock-validation.json
          if-no-files-found: warn
          retention-days: 7
