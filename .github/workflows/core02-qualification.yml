name: Core-02 bounded qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core02:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Read immutable corpus pin
        id: corpus
        run: |
          python - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path('config/wexp-vectors-core02.lock.json').read_bytes())
          if lock['repository'] != 'WEXP-dev/wexp-vectors' or not re.fullmatch('[0-9a-f]{40}', lock['commit']):
              raise SystemExit('An exact public vector commit is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('commit=' + lock['commit'] + '\n')
              stream.write('manifest=' + lock['manifest_sha256'] + '\n')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: WEXP-dev/wexp-vectors
          ref: ${{ steps.corpus.outputs.commit }}
          path: build/core02-vectors
          persist-credentials: false
      - name: Install the package
        run: python -m pip install --no-deps .
      - name: Verify pinned corpus without executing expectation code
        run: |
          python -B scripts/verify_core02_corpus.py --repository build/core02-vectors
          python -B build/core02-vectors/vectors/WEXP-CORE-02-VECTORS-001/verify.py --expected-manifest-sha256 ${{ steps.corpus.outputs.manifest }}
      - name: Locked full-result comparison in normal and optimized modes
        run: |
          python -B scripts/qualify_core02_locked.py --vectors build/core02-vectors --output-dir build/core02-results
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('normal.json', 'optimized.json'):
              report = json.loads(Path('build/core02-results', name).read_text())
              if report['status'] != 'PASS_BOUNDED' or report['passed'] != 89 or report['comparator_negative_controls_passed'] != 42:
                  raise SystemExit('Incomplete bounded qualification: ' + name)
          PY
      - name: Ingress, JSON boundary, comparator and CLI regressions
        run: |
          python -B -m unittest discover -s tests -p 'test_core02_*.py' -v
          python -B -O -m unittest discover -s tests -p 'test_core02_*.py' -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: core02-reports-${{ matrix.python }}
          path: build/core02-results/*.json
          if-no-files-found: warn
          retention-days: 90
