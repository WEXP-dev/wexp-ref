[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wexp-ref"
version = "0.2.0.dev0"
description = "Reference implementation and execution tooling for published WEXP specifications"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "WEXP contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
wexp-ref = "wexp_ref.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Schemas, declared environments and synthetic seeds are data the harness reads
# at run time; without this they are absent from an installed distribution and
# the package works only from a source checkout.
"wexp_ref.core01" = ["schema/*.json", "environments/*.json", "seeds/*.json"]

[tool.unittest]
start-directory = "tests"
